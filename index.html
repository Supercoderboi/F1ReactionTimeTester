<!DOCTYPE html>
<html lang="en">
<head>
    <title>F1 BASED REACTION TIME DETECTOR</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" type="module"></script>
</head>
<body>
    <main class="game">

        <header class="header">
            <div class="topline">
                <span class="tag">REACTION TEST // 01</span>
               
            </div>

            <h1>LIGHTS <span>OUT.</span></h1>
            <p class="subtitle">CLICK ON THE SPEEDOMETER TO START.</p>
        </header>

        <section class="lights">
            <div class="circle" id="light1"></div>
            <div class="circle" id="light2"></div>
            <div class="circle" id="light3"></div>
            <div class="circle" id="light4"></div>
            <div class="circle" id="light5"></div>
        </section>

        <section class="cockpit">
            <div class="speedometer" id="speedometer">
                <div class="dial-marks"></div>
                <div class="needle" id="needle"></div>
                <div class="hub"></div>

                <div class="speed-text" id="speed-text">0.000</div>
                <div class="unit">REACTION TIME · SECONDS</div>
            </div>

            <div class="score-panel">
                <span class="trophy">🏆</span>
                <div class="score-info">
                    <span class="score-label">PERSONAL BEST</span>
                    <h2 id="HighScore">0.000 s</h2>
                </div>
            </div>

            
            </div>
        </section>

    </main>
</body>
</html>
